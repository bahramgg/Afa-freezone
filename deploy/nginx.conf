# AFA — nginx در جلوی برنامه
#
# جای PANEL.EXAMPLE.IR را با زیردامنهٔ خودتان عوض کنید و همین بس. برنامه روی
# 127.0.0.1:3000 گوش می‌دهد و از بیرون دیده نمی‌شود؛ تنها راه رسیدن به آن همین
# فایل است.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/afa
#   sudo ln -s /etc/nginx/sites-available/afa /etc/nginx/sites-enabled/afa
#   sudo nginx -t && sudo systemctl reload nginx

# خط‌های [::] فقط اگر سرور IPv6 دارد از کامنت دربیایند. nginx روی سروری که
# IPv6 ندارد با `Address family not supported` بالا نمی‌آید، و سرویسی که اصلاً
# استارت نمی‌شود بدتر از سرویسی است که IPv6 ندارد.

server {
    listen 80;
    # listen [::]:80;
    server_name PANEL.EXAMPLE.IR;

    # تنها چیزی که روی HTTP سرو می‌شود: تأیید مالکیت دامنه برای Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2 on;` جداگانه از nginx ۱٫۲۵ به بعد است و اوبونتو ۲۴٫۰۴ نسخهٔ ۱٫۲۴
    # دارد. این شکل روی هر دو کار می‌کند؛ روی ۱٫۲۵ به بالا فقط یک هشدار
    # منسوخ‌شدگی می‌دهد.
    listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    server_name PANEL.EXAMPLE.IR;

    ssl_certificate     /etc/letsencrypt/live/PANEL.EXAMPLE.IR/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PANEL.EXAMPLE.IR/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # کوکی نشست در تولید `secure` است، یعنی روی HTTP اصلاً فرستاده نمی‌شود.
    # بدون این هدر، مرورگری که یک بار HTTP را دیده باشد ممکن است دوباره برود.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # بزرگ‌ترین چیزی که سرو می‌شود ویدئوهای راهنماست و آن‌ها خروجی‌اند نه ورودی.
    # هیچ درخواستی به این سقف نزدیک نمی‌شود؛ عدد کوچک فقط یک خطای گیج‌کننده
    # می‌سازد.
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # بازنویسی، نه افزودن.
        #
        # `clientIp` در برنامه اولین مقدار این هدر را برمی‌دارد و همان کلیدِ
        # محدودیت نرخ برای درخواست و تأیید کد ورود است. با
        # `$proxy_add_x_forwarded_for` هرچه کلاینت بفرستد اول صف می‌نشیند، و
        # کسی که هدر را در هر درخواست عوض کند سقف تلاش را دور می‌زند و کد
        # شش‌رقمی را می‌تواند حدس بزند. nginx تنها واسطه است، پس مقدار واقعی
        # همین است و بس.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # تأیید یک تراکنش، نود زنجیره را می‌خواند و آن گاهی کند است.
        proxy_read_timeout 120s;
    }
}
